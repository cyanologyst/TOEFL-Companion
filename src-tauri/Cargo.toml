[package]
name = "toefl-companion"
version = "1.1.1"
description = "Local-first TOEFL vocabulary, speaking, and writing practice for Windows"
authors = ["TOEFL Companion"]
license = "Proprietary"
edition = "2024"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "toefl_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

# Only for the taskbar icon: the windowing layer sets a window icon as
# ICON_SMALL alone, and the taskbar button draws ICON_BIG. See lib.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["image-png"] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
whisper-rs = { version = "0.16", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
num_cpus = "1"
reqwest = { version = "0.12", features = ["stream"] }
